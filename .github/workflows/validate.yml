name: Validate Mystro-Shop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check script.js && node --check service-worker.js && node --check worker.js && node --check account-control.js && node --check admin-users-v2.js && node --check admin-lazy-loader.js && node --check admin-wallet-history-lite.js && node --check admin-approvals-lite.js && node --check profile-save-fix.js
      - name: Check required files
        run: test -s index.html && test -s style.css && test -s checkout.html && test -s manifest.json && test -s profile-save-fix.js
      - name: Check no buyer/seller commission text in HTML
        run: |
          if grep -Ei 'commission|vendeur\(s\) 90%|Mystro-Shop 10%' index.html checkout.html; then
            echo 'Internal fee split must not be visible in buyer/seller HTML.'
            exit 1
          fi
