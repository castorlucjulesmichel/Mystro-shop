name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firebase-rules.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: mystro-shop-firestore-rules-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mystroshop-eab92
          workload_identity_provider: projects/104073035061/locations/global/workloadIdentityPools/mystroshop-github/providers/mystroshop-github
          service_account: mystroshop-github-deploy@mystroshop-eab92.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project mystroshop-eab92 --non-interactive
