name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firebase-rules.yml

permissions:
  contents: read

concurrency:
  group: mystro-shop-firestore-rules-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment credentials
        id: credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase rules deployment skipped: add FIREBASE_TOKEN to GitHub Actions secrets."
          fi

      - name: Install Firebase CLI
        if: steps.credentials.outputs.ready == 'true'
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        if: steps.credentials.outputs.ready == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --project mystroshop-eab92 --token "$FIREBASE_TOKEN" --non-interactive
