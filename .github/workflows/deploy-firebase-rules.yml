name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firebase-rules.yml

permissions:
  contents: read

concurrency:
  group: mystro-shop-firestore-rules-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          test -n "$FIREBASE_TOKEN"
          firebase deploy --only firestore:rules --project mystroshop-eab92 --token "$FIREBASE_TOKEN" --non-interactive
